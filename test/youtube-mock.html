<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>content.js mock</title>
<link rel="stylesheet" href="../extension/src/content.css">
<style>
  body { padding-right:440px; font: 14px/1.4 system-ui, sans-serif; margin: 16px; max-width: 900px; }
  #movie_player { position: relative; width: 640px; max-width: 100%; }
  video { width: 100%; display: block; background: #000; }
  pre { background: #111; color: #ddd; padding: 8px; height: 240px; overflow: auto; font-size: 12px; }
  .pass { color: #1a7f37; } .fail { color: #cf222e; font-weight: 600; }
  button#run { font: inherit; padding: 6px 12px; margin: 8px 0; }
</style>
</head>
<body>
<h1>content.js on a mock YouTube page</h1>
<p>Real content.js, player and audio code; stubbed <code>chrome.storage</code>, Gemini video calls and speech rendering.</p>
<div id="movie_player" class="html5-video-player" style="height:330px;background:linear-gradient(135deg,#e5dcce,#536858);color:white;display:grid;place-items:center;border-radius:14px"><div><h2>AutoAD · Local demo</h2><p>Simulated video / scripted answers / test tones</p><button id="demo-play">Play / Pause demo</button><span id="demo-time">00:00</span></div></div>
<button id="run">Run scripted tests</button> <strong id="status"></strong>
<h2>Results</h2>
<ul id="results"></ul>
<h2>Log</h2>
<pre id="log"></pre>

<script src="../extension/src/gemini.js"></script>
<script src="../extension/src/settings.js"></script>
<script src="../extension/src/cache.js"></script>
<script src="../extension/src/coordinator.js"></script>
<script src="../extension/src/panel.js"></script>
<script src="../extension/src/live.js"></script>
<script src="../extension/src/audio.js"></script>
<script src="../extension/src/player.js"></script>
<script src="fake-video.js"></script>
<script>
// ---- stubs: chrome.storage, Gemini ----
const store = { apiKey: 'test-key', enabled: false };
const changeListeners = [];
const pick = (keys) => {
  if (keys == null) return { ...store };
  const out = {};
  for (const k of [].concat(keys)) if (k in store) out[k] = store[k];
  return out;
};
const notify = (changes) => setTimeout(() => changeListeners.forEach((fn) => fn(changes, 'local')), 0);
window.chrome = window.chrome || {};
chrome.storage = {
  local: {
    get: async (keys) => pick(keys),
    set: async (obj) => {
      const changes = {};
      for (const [k, v] of Object.entries(obj)) { changes[k] = { oldValue: store[k], newValue: v }; store[k] = v; }
      notify(changes);
    },
    remove: async (keys) => { for (const k of [].concat(keys)) delete store[k]; },
  },
  onChanged: { addListener: (fn) => changeListeners.push(fn) },
};

const testVideo = new FakeVideo({ duration: 60 });
const realQuerySelector = document.querySelector.bind(document);
document.querySelector = (selector) => selector === '#movie_player video.html5-main-video'
  ? testVideo
  : realQuerySelector(selector);

const CUES = [
  { start: 5, end: 9, text: 'A woman opens the door.', sec: 2.5 },
  { start: 20, end: 24, text: 'She walks into the rain.', sec: 3.0 },
  { start: 30, end: 34, text: 'A taxi pulls up.', sec: 2.0 },
  { start: 45, end: 49, text: 'Title: THE END.', sec: 2.0 },
];
const calls = { gen: [], tts: [], moment: [], scene: [] };
const wait = (ms, signal) => new Promise((resolve, reject) => {
  const t = setTimeout(resolve, ms);
  signal?.addEventListener('abort', () => { clearTimeout(t); reject(new DOMException('aborted', 'AbortError')); }, { once: true });
});
function beepB64(sec) {
  const rate = 24000;
  const s = new Int16Array(Math.round(sec * rate));
  for (let i = 0; i < s.length; i++) s[i] = Math.round(6000 * Math.sin(2 * Math.PI * 660 * i / rate));
  const bytes = new Uint8Array(s.buffer);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
AutoAD.generateTrack = async ({ videoUrl, durationSec, model, signal }) => {
  calls.gen.push({ videoUrl, durationSec, model });
  await wait(1000, signal);
  return { cues: CUES.map(({ start, end, text }) => ({ start, end, text })), usage: {}, ms: 1000 };
};
AutoAD.generateSceneIndex = async ({ videoUrl, durationSec, model, signal }) => {
  calls.scene.push({ videoUrl, durationSec, model });
  await wait(700, signal);
  return {
    scenes: [{ start: '00:00.0', end: '00:10.0', description: 'A woman in a yellow coat walks along the wet red track, carrying a blue umbrella.', visibleText: '' }],
    usage: {}, ms: 700,
  };
};
AutoAD.renderSpeech = async ({ text, voice, signal }) => {
  calls.tts.push({ text, voice });
  await wait(150, signal);
  return { data: beepB64(CUES.find((c) => c.text === text)?.sec || 0.6), rate: 24000 };
};
AutoAD.describeMoment = async ({ currentSec, question, conversation, signal }) => {
  calls.moment.push({ currentSec, question, conversation });
  await wait(100, signal);
  return `At ${currentSec.toFixed(1)} seconds, the woman is holding a red umbrella.`;
};

let denyMicrophone = false, microphoneStopped = 0, voiceDelay = 30;
Object.defineProperty(navigator.mediaDevices, 'getUserMedia', {configurable:true, value: async () => {
  if(denyMicrophone) throw new DOMException('Permission denied','NotAllowedError');
  return {getTracks:()=>[{stop:()=>microphoneStopped++}]};
}});
class MockContext {
 constructor(){this.state='running';this.currentTime=0;this.destination={};this.sampleRate=48000;}
 async resume(){} async close(){this.state='closed';}
 createMediaStreamSource(){return {connect(){},disconnect(){}};}
 createScriptProcessor(){return {connect(){},disconnect(){}};}
 createGain(){return {gain:{value:1},connect(){},disconnect(){}};}
 createBuffer(_n,length,rate){return {duration:length/rate,copyToChannel(){}};}
 createBufferSource(){let timer;return {playbackRate:{value:1},connect(){},stop(){clearTimeout(timer);},start(){timer=setTimeout(()=>this.onended?.(),100);}};}
}
window.AudioContext=MockContext;
let liveCalls=0, liveClosed=0;
AutoAD.LiveVoice.connect=async options=>{
 liveCalls++;await wait(voiceDelay,options.signal);
 return {close(){liveClosed++;},send(message){if(message.realtimeInput?.activityEnd){setTimeout(()=>options.onMessage({serverContent:{inputTranscription:{text:'What is she wearing?'},outputTranscription:{text:'She is wearing a red coat.'},modelTurn:{parts:[{inlineData:{mimeType:'audio/pcm;rate=24000',data:beepB64(0.1)}}]},turnComplete:true}}),50);}}};
};
document.getElementById('demo-play').onclick=()=>testVideo.paused?testVideo.play():testVideo.pause();
testVideo.addEventListener('timeupdate',()=>{document.getElementById('demo-time').textContent=AutoAD.formatTime(testVideo.currentTime);});
history.replaceState(null, '', '/watch?v=vidA');
</script>
<script src="../extension/src/content.js"></script>
<script>
const video = testVideo;
const logEl = document.getElementById('log');
const resultsEl = document.getElementById('results');
const runBtn = document.getElementById('run');
const btn = () => document.querySelector('.autoad-btn');
const describeBtn = () => document.querySelector('.autoad-ask');
const askBtn = () => document.querySelector('.autoad-send');
const questionInput = () => document.querySelector('.autoad-question');
const answer = () => document.querySelector('.autoad-line')?.textContent || '';
const line = () => document.querySelector('.autoad-line')?.textContent || '';
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function log(s) { logEl.textContent += s + '\n'; logEl.scrollTop = logEl.scrollHeight; }
function waitFor(pred, timeout, label) {
  return new Promise((resolve, reject) => {
    const t0 = performance.now();
    const iv = setInterval(() => {
      const r = pred();
      if (r) { clearInterval(iv); resolve(r); }
      else if (performance.now() - t0 > timeout) { clearInterval(iv); reject(new Error(`timed out: ${label} (button: "${btn()?.textContent}")`)); }
    }, 25);
  });
}
async function seek(t) {
  const done = new Promise((r) => video.addEventListener('seeked', r, { once: true }));
  video.currentTime = t;
  await done;
}
function navigate(id) {
  document.dispatchEvent(new Event('yt-navigate-start'));
  history.pushState(null, '', `/watch?v=${id}`);
  document.dispatchEvent(new Event('yt-navigate-finish'));
}
let passed = 0, total = 0;
function check(name, ok, detail = '') {
  total++; if (ok) passed++;
  const li = document.createElement('li');
  li.className = ok ? 'pass' : 'fail';
  li.textContent = `${ok ? 'PASS' : 'FAIL'}  ${name}  ${detail}`;
  resultsEl.append(li);
  log(`${ok ? 'PASS' : 'FAIL'} ${name} ${detail}`);
}
async function step(name, fn) {
  log(`\n# ${name}`);
  try { await fn(); } catch (e) { check(name, false, e.message); }
}

const action=name=>document.querySelector(`[data-action="${name}"]`);
const status=()=>document.querySelector('.autoad-status')?.textContent||'';
async function run(){
 runBtn.disabled=true;
 await step('Preparation and accessible panel',async()=>{
  await waitFor(()=>btn(),2000,'panel');
  check('off until explicit enable; no quota spent',calls.gen.length===0&&btn().textContent==='Enable descriptions');
  check('panel has landmark name',document.querySelector('aside').getAttribute('aria-label').includes('AutoAD'));
  check('settings use native radio groups',document.querySelectorAll('.autoad-ui fieldset').length===5);
  check('live status separate from spoken answer',document.querySelector('.autoad-status').getAttribute('role')==='status'&&!document.querySelector('.autoad-line').hasAttribute('aria-live'));
  await video.play();btn().click();
  check('enable pauses video immediately',video.paused);
  await waitFor(()=>status().startsWith('Ready'),5000,'ready');
  check('ready keeps video paused',video.paused);
  check('video analyzed once; scene indexed once',calls.gen.length===1&&calls.scene.length===1);
  check('persisted complete audio exists',Object.entries(store).some(([k,v])=>k.startsWith('autoad:v3:audio:')&&v.complete));
  btn().click();check('continue starts video',!video.paused);
 });
 await step('Text question, replay and follow-up',async()=>{
  video.currentTime=4;await video.play();questionInput().value='What is she holding?';askBtn().click();
  check('question pauses playing video',video.paused);
  await waitFor(()=>answer().includes('red umbrella'),3000,'answer');
  await waitFor(()=>status()==='Video paused',3000,'speech completed');
  check('answer does not auto-resume',video.paused);
  const n=calls.tts.length;action('repeat').click();await sleep(800);check('repeat does not call TTS',calls.tts.length===n);
  questionInput().value='What color is it?';askBtn().click();await waitFor(()=>calls.moment.length===2,2000,'follow-up');
  check('follow-up receives earlier conversation',calls.moment[1].conversation.length===1);
  btn().click();check('continue resumes during pending answer',!video.paused);await sleep(300);check('late answer does not stop video',!video.paused);
 });
 await step('Settings and cache',async()=>{
  video.pause();const n=calls.tts.length;
  document.querySelector('input[name="autoad-speed"][value="1.5"]').click();await sleep(250);
  check('speed changes saved without TTS',store.speed===1.5&&calls.tts.length===n);
  const gen=calls.gen.length;const select=document.querySelector('[data-setting=voice]');select.value='Kore';select.dispatchEvent(new Event('change',{bubbles:true}));
  await waitFor(()=>calls.tts.length>=n+4,5000,'new voice');
  check('voice change reuses text analysis',calls.gen.length===gen);
  check('new voice passed to TTS',calls.tts.slice(n).every(c=>c.voice==='Kore'));
  await waitFor(()=>status().startsWith('Ready'),3000,'ready again');
  await waitFor(()=>Object.entries(store).filter(([k,v])=>k.startsWith('autoad:v3:audio:')&&v.complete&&CUES.some(c=>c.text===v.value.text)).length>=8,3000,'all original and changed-voice audio committed');
  const total=calls.tts.length;btn().click();btn().click();check('pause descriptions leaves video playing',!video.paused);
  btn().click();await waitFor(()=>status().startsWith('Ready'),2000,'cache ready');check('re-enable reuses cached audio',calls.tts.length===total);
 });
 await step('Seek and advertisement cancellation',async()=>{
  questionInput().value='Describe it';askBtn().click();video.currentTime=25;await sleep(400);
  check('seek suppresses late response',answer().includes('Position changed'));
  const mp=document.querySelector('#movie_player');mp.classList.add('ad-showing');await sleep(40);
  check('ad suspends questions and narration',status().startsWith('Advertisement')&&askBtn().disabled);
  mp.classList.remove('ad-showing');await sleep(40);check('questions recover after ad',!askBtn().disabled);
 });
 await step('Voice microphone and complete streamed replay',async()=>{
  await video.play();action('voice').click();check('voice question pauses video',video.paused);
  await waitFor(()=>status().startsWith('Listening'),2000,'microphone');
  action('voice').click();check('Stop & send closes microphone',microphoneStopped>0);
  await waitFor(()=>status()==='Video paused',2000,'voice answer');check('voice transcript displayed',answer().includes('red coat'));
  const n=liveCalls;action('repeat').click();await sleep(250);check('voice replay uses saved PCM',liveCalls===n);
  denyMicrophone=true;action('voice').click();await waitFor(()=>status()==='Needs attention',2000,'permission error');
  check('permission failure has retry and continue',btn().textContent==='Retry'&&!action('continue').hidden);
  denyMicrophone=false;action('continue').click();check('continue after mic failure works',!video.paused);
  voiceDelay=600;action('voice').click();await sleep(40);btn().click();await sleep(700);
  check('continue during microphone setup cancels without new recording',!video.paused&&!status().startsWith('Listening'));
 });
 await step('Navigation and context reset',async()=>{
  navigate('vidB');await waitFor(()=>btn()?.textContent==='Enable descriptions',3000,'new video');
  check('new video needs explicit enable',calls.gen.length===1);
  document.dispatchEvent(new Event('yt-navigate-start'));history.pushState(null,'','/feed/subscriptions');document.dispatchEvent(new Event('yt-navigate-finish'));await sleep(700);
  check('leaving video hides panel',document.querySelector('.autoad-ui').hidden);
 });
 video.pause();document.getElementById('status').textContent=`${passed}/${total} passed`;document.title=`AutoAD integration: ${passed}/${total} passed`;
}
runBtn.addEventListener('click',run);
</script></body></html>
