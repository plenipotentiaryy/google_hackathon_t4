<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AutoAD compact layout check</title>
    <link rel="stylesheet" href="../extension/src/content.css" />
    <style>
      body {
        margin: 24px;
        background: #ecebf3;
        font: 14px system-ui;
        color: #28223c;
      }
      #results {
        max-width: 650px;
        white-space: pre-wrap;
      }
      button {
        padding: 8px;
      }

        font-size: 22px;

    <pre id="results"></pre>
    <script src="../extension/src/gemini.js"></script>
